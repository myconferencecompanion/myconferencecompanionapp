name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Create dummy .env for CI
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy_key" >> .env
          echo "GOOGLE_MAPS_API_KEY=dummy_key" >> .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Split per ABI: arm64 APK is ~1/3 the size of the fat APK.
      - name: Build (APK release, split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: conference-companion-release-apks
          path: build/app/outputs/flutter-apk/*release*.apk
          retention-days: 30

